<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2EBDD">
  <title>審神者管理ツール</title>
</head>
<body>
<div id="app"></div>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #F2EBDD;
  }
  #app {
    --paper: #F2EBDD;
    --paper-deep: #E8DFC9;
    --wood: #7A4B32;
    --wood-dark: #5C3722;
    --moss: #5B6B45;
    --hanko: #A8382C;
    --ink: #2B2621;
    --ink-soft: #5C544A;
    --tag-border: #C9BFA6;

    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  #app * { box-sizing: border-box; }

  .view { display: none; min-height: 100vh; }
  .view.active { display: block; }

  /* ---- ホーム画面 ---- */
  #home-view { padding: 28px 16px 40px; }
  .home-header { margin-bottom: 30px; text-align: center; }
  .home-header .seal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px; height: 30px;
    border-radius: 7px;
    background: var(--hanko);
    color: #fff;
    font-size: 15px;
    font-family: "Hiragino Mincho ProN", serif;
    margin-bottom: 8px;
  }
  .home-header h1 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 22px;
    letter-spacing: 0.08em;
    margin: 0 0 6px;
  }
  .home-header p {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin: 0;
  }

  .search-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 360px;
    margin: 0 auto 14px;
  }
  .search-bar {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 1px solid var(--tag-border);
    border-radius: 999px;
    padding: 7px 14px;
  }
  .search-icon { font-size: 13px; color: var(--ink-soft); flex-shrink: 0; }
  .search-input-wrap {
    flex: 1;
    min-width: 0;
    height: 18px;
    position: relative;
    overflow: hidden;
  }
  .search-input {
    position: absolute;
    left: 0; top: 50%;
    width: 128%;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    transform: translateY(-50%) scale(0.8125);
    transform-origin: left center;
  }
  .search-input::placeholder { color: var(--ink-soft); }

  .menu-wrap { position: relative; flex-shrink: 0; }
  .menu-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: none;
    border: none;
    font-family: inherit;
    color: var(--ink);
    padding: 2px;
  }
  .menu-icon { font-size: 22px; line-height: 1; }
  .menu-label { font-size: 9px; color: var(--ink-soft); }

  .menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 16, 12, 0);
    z-index: 900;
    pointer-events: none;
    transition: background 0.3s ease;
  }
  .menu-overlay.open {
    background: rgba(20, 16, 12, 0.45);
    pointer-events: auto;
  }
  .menu-panel {
    position: fixed;
    top: 0; right: 0;
    width: 82%;
    max-width: 300px;
    height: 100%;
    background: var(--paper);
    box-shadow: -6px 0 18px rgba(0,0,0,0.25);
    transform: translateX(100%);
    transition: transform 0.32s ease;
    z-index: 901;
    overflow-y: auto;
  }
  .menu-panel.open { transform: translateX(0); }
  .menu-panel-head {
    background: linear-gradient(160deg, #8C5D3D, var(--wood-dark));
    padding: 20px 16px 26px;
    position: relative;
  }
  .menu-close {
    position: absolute;
    top: 14px; right: 14px;
    background: none;
    border: none;
    color: #FBF6EA;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-family: inherit;
  }
  .menu-close .x { font-size: 20px; line-height: 1; }
  .menu-close .lbl { font-size: 9px; }
  .menu-panel-head .seal-name {
    color: #FBF6EA;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 15px;
    letter-spacing: 0.05em;
    margin-top: 6px;
  }
  .menu-section-title {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 15px;
    padding: 18px 16px 6px;
    text-decoration: underline;
    text-decoration-style: wavy;
    text-decoration-color: var(--hanko);
    text-underline-offset: 5px;
    display: inline-block;
    margin: 0 16px;
  }
  .menu-list { padding: 6px 6px 24px; }
  .menu-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 12px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--ink);
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
  }
  .menu-row:active { background: var(--paper-deep); }
  .menu-row .row-icon {
    width: 26px; height: 26px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-family: "Hiragino Mincho ProN", serif;
    font-size: 12px;
    color: #FBF6EA;
    flex-shrink: 0;
  }
  .menu-row.disabled { color: var(--ink-soft); }
  .menu-row.disabled .row-icon { background: var(--tag-border) !important; }
  .menu-row .row-tag {
    margin-left: auto;
    font-size: 9.5px;
    color: var(--ink-soft);
    background: var(--paper-deep);
    padding: 2px 7px;
    border-radius: 999px;
  }

  .banner-wrap {
    position: relative;
    width: 100%;
    max-width: 360px;
    margin: 0 auto 6px;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }
  .banner-track {
    display: flex;
    height: 100%;
    transition: transform 0.45s ease;
  }
  .banner-slide {
    flex-shrink: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FBF6EA;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 14px;
    letter-spacing: 0.05em;
  }
  .banner-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 26px; height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.35);
    color: #fff;
    font-size: 14px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .banner-arrow.prev { left: 8px; }
  .banner-arrow.next { right: 8px; }
  .banner-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 8px 0 20px;
  }
  .banner-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--tag-border);
    border: none;
    padding: 0;
  }
  .banner-dot.active { background: var(--hanko); width: 14px; border-radius: 999px; transition: width 0.2s; }

  .icon-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    max-width: 320px;
    margin: 0 auto;
  }
  .app-icon-btn {
    background: none;
    border: none;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 0;
  }
  .app-icon-glyph {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 22%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 26px;
    color: #FBF6EA;
    box-shadow: 0 4px 10px rgba(0,0,0,0.22);
  }
  .app-icon-glyph.rooms { background: linear-gradient(160deg, #8C5D3D, var(--wood-dark)); }
  .app-icon-glyph.network { background: linear-gradient(160deg, #C24B3C, #7E2A20); }
  .app-icon-glyph.master { background: linear-gradient(160deg, #6E7E52, #454F34); }
  .app-icon-glyph.soon {
    background: linear-gradient(160deg, #D8CDB4, var(--tag-border));
    color: var(--ink-soft);
    box-shadow: none;
  }
  .app-icon-btn:active .app-icon-glyph { transform: scale(0.94); }
  .app-icon-label {
    font-size: 10.5px;
    color: var(--ink);
    text-align: center;
    line-height: 1.3;
  }
  .app-icon-btn.soon .app-icon-label { color: var(--ink-soft); }

  .home-note {
    max-width: 320px;
    margin: 34px auto 0;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.7;
  }

  .feed-section {
    max-width: 320px;
    margin: 30px auto 0;
  }
  .feed-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 15px;
    margin-bottom: 10px;
  }
  .feed-title .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--hanko);
  }
  .feed-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
    max-height: 195px;
    overflow-y: auto;
    padding: 2px;
    border: 1px solid var(--tag-border);
    border-radius: 10px;
    background: rgba(255,255,255,0.35);
  }
  .feed-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--paper-deep);
    border: 1px solid var(--tag-border);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .feed-icon {
    flex-shrink: 0;
    width: 18px; height: 18px;
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-family: "Hiragino Mincho ProN", serif;
    font-size: 9.5px;
    color: #FBF6EA;
  }
  .feed-icon.rooms { background: var(--wood); }
  .feed-icon.network { background: var(--hanko); }
  .feed-icon.master { background: var(--moss); }
  .feed-icon.x { background: #14171A; font-family: sans-serif; font-weight: 700; }
  .feed-text {
    flex: 1;
    min-width: 0;
    font-size: 11.5px;
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .feed-time {
    flex-shrink: 0;
    font-size: 9.5px;
    color: var(--ink-soft);
  }
  .feed-item.linked { cursor: pointer; }
  .feed-empty {
    font-size: 11.5px;
    color: var(--ink-soft);
    text-align: center;
    padding: 18px 10px;
    background: var(--paper-deep);
    border: 1px dashed var(--tag-border);
    border-radius: 9px;
  }

  .feed-add-toggle {
    width: 100%;
    background: none;
    border: 1px dashed var(--tag-border);
    border-radius: 8px;
    padding: 8px;
    font-size: 11px;
    font-family: inherit;
    color: var(--ink-soft);
    margin-top: 8px;
  }
  .feed-add-form {
    display: none;
    margin-top: 8px;
    background: var(--paper-deep);
    border: 1px solid var(--tag-border);
    border-radius: 9px;
    padding: 10px;
  }
  .feed-add-form.open { display: block; }
  .feed-add-form select,
  .feed-add-form input {
    width: 100%;
    background: #fff;
    border: 1px solid var(--tag-border);
    border-radius: 6px;
    padding: 7px 8px;
    font-size: 16px;
    font-family: inherit;
    margin-bottom: 7px;
  }
  .feed-add-submit {
    width: 100%;
    background: var(--hanko);
    color: #FBF6EA;
    border: none;
    border-radius: 7px;
    padding: 9px;
    font-size: 12px;
    font-family: inherit;
  }

  .gov-section {
    max-width: 320px;
    margin: 30px auto 10px;
  }
  .gov-banner {
    background: var(--hanko);
    color: #FBF6EA;
    text-align: center;
    padding: 9px;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 13px;
    letter-spacing: 0.15em;
    border-radius: 6px 6px 0 0;
  }
  .gov-box {
    border: 2px solid var(--ink);
    border-top: none;
    background: #fff;
    padding: 6px 16px 12px;
    border-radius: 0 0 6px 6px;
  }
  .gov-link {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 12.5px;
    color: var(--ink);
    text-decoration: none;
    padding: 10px 0;
    border-bottom: 1px dashed var(--tag-border);
  }
  .gov-link:last-of-type { border-bottom: none; }
  .gov-link .gov-mark { color: var(--hanko); font-family: "Hiragino Mincho ProN", serif; flex-shrink: 0; }
  .gov-link .gov-name { text-decoration: underline; text-underline-offset: 3px; }
  .gov-note {
    font-size: 9.5px;
    color: var(--ink-soft);
    text-align: center;
    margin-top: 8px;
    letter-spacing: 0.03em;
  }

  /* ---- サブビュー(iframe側) ---- */
  .sub-topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--paper-deep);
    border-bottom: 1px solid var(--tag-border);
  }
  .back-btn {
    background: var(--wood);
    color: #FBF6EA;
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 12px;
    font-family: inherit;
  }
  .back-btn:active { background: var(--wood-dark); }
  .sub-topbar .sub-title {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 14px;
  }
  .sub-frame-wrap { height: calc(100vh - 44px); }
  .sub-frame-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>

      <div class="feed-list" id="feed-list"></div>
      <button class="feed-add-toggle" id="feed-add-toggle">＋ 公式の更新を追加</button>
      <div class="feed-add-form" id="feed-add-form">
        <select id="feed-add-account">
          <option value="刀剣乱舞X">刀剣乱舞 X（運営）</option>
          <option value="本丸通信">本丸通信</option>
        </select>
        <input id="feed-add-text" placeholder="投稿内容(メモでOK)" />
        <input id="feed-add-url" placeholder="投稿のURL(任意)" />
        <button class="feed-add-submit" id="feed-add-submit">この内容で追加</button>
      </div>
    </div>
    <div class="gov-section">
      <div class="gov-banner">政府へのご連絡</div>
      <div class="gov-box">
        <a class="gov-link" href="https://www.toukenranbu.jp" target="_blank" rel="noopener">
          <span class="gov-mark">・</span><span class="gov-name">刀剣乱舞 公式サイト</span>
        </a>
        <a class="gov-link" href="https://x.com/touken_staff?s=11&t=Q6jIjnXHdKMg42DONGJCjg" target="_blank" rel="noopener">
          <span class="gov-mark">・</span><span class="gov-name">刀剣乱舞 X（運営）</span>
        </a>
        <a class="gov-link" href="https://x.com/tkrb_ht?s=11&t=Q6jIjnXHdKMg42DONGJCjg" target="_blank" rel="noopener">
          <span class="gov-mark">・</span><span class="gov-name">本丸通信</span>
        </a>
      </div>
      <div class="gov-note">お手続きはこちらの窓口よりお願いいたします</div>
    </div>
  `;
  root.appendChild(homeView);

  // ---- サイドメニュー(スライドパネル) ----
  const menuOverlay = document.createElement("div");
  menuOverlay.className = "menu-overlay";
  menuOverlay.id = "menu-overlay";

  const menuPanel = document.createElement("div");
  menuPanel.className = "menu-panel";
  menuPanel.id = "menu-panel";
  menuPanel.innerHTML = `
    <div class="menu-panel-head">
      <button class="menu-close" id="menu-close">
        <span class="x">×</span><span class="lbl">閉じる</span>
      </button>
      <div class="seal-name">審神者管理ツール</div>
    </div>
    <div class="menu-section-title">本丸のコンテンツ</div>
    <div class="menu-list" id="menu-list"></div>
  `;
  root.appendChild(menuOverlay);
  root.appendChild(menuPanel);

  const MENU_ITEMS = [
    { label: "部屋割り", glyph: "丸", color: "var(--wood)", action: () => showView("rooms-view") },
    { label: "相関図",   glyph: "縁", color: "var(--hanko)", action: () => showView("network-view") },
    { label: "刀剣男士", glyph: "刀", color: "var(--moss)", action: () => showView("master-view") },
    { label: "本丸設定",       glyph: "本", color: "var(--tag-border)", disabled: true },
    { label: "設定",           glyph: "設", color: "var(--tag-border)", disabled: true }
  ];
  const menuList = document.getElementById("menu-list");
  MENU_ITEMS.forEach(item => {
    const row = document.createElement("button");
    row.className = "menu-row" + (item.disabled ? " disabled" : "");
    row.innerHTML = `
      <span class="row-icon" style="background:${item.color}">${item.glyph}</span>
      <span>${item.label}</span>
      ${item.disabled ? '<span class="row-tag">準備中</span>' : ""}
    `;
    if (!item.disabled) {
      row.onclick = () => { item.action(); closeMenu(); };
    }
    menuList.appendChild(row);
  });

  function openMenu() {
    menuOverlay.classList.add("open");
    menuPanel.classList.add("open");
  }
  function closeMenu() {
    menuOverlay.classList.remove("open");
    menuPanel.classList.remove("open");
  }
  document.getElementById("menu-btn").onclick = openMenu;
  document.getElementById("menu-close").onclick = closeMenu;
  menuOverlay.onclick = closeMenu;

  // ---- バナーカルーセル(色べた塗りプレースホルダー) ----
  const BANNER_COLORS = ["#8C5D3D", "#A8382C", "#6E7452", "#B98D5B", "#5C3722"];
  const BANNER_LABELS = ["お知らせ①", "お知らせ②", "お知らせ③", "お知らせ④", "お知らせ⑤"];
  const track = document.getElementById("banner-track");
  const dotsWrap = document.getElementById("banner-dots");
  let bannerIndex = 0;

  BANNER_COLORS.forEach((color, i) => {
    const slide = document.createElement("div");
    slide.className = "banner-slide";
    slide.style.background = color;
    slide.textContent = BANNER_LABELS[i];
    track.appendChild(slide);

    const dot = document.createElement("button");
    dot.className = "banner-dot" + (i === 0 ? " active" : "");
    dot.onclick = () => { goToSlide(i); resetTimer(); };
    dotsWrap.appendChild(dot);
  });

  function goToSlide(i) {
    bannerIndex = (i + BANNER_COLORS.length) % BANNER_COLORS.length;
    track.style.transform = `translateX(-${bannerIndex * 100}%)`;
    dotsWrap.querySelectorAll(".banner-dot").forEach((d, idx) => {
      d.classList.toggle("active", idx === bannerIndex);
    });
  }

  let bannerTimer = null;
  function resetTimer() {
    if (bannerTimer) clearInterval(bannerTimer);
    bannerTimer = setInterval(() => goToSlide(bannerIndex + 1), 3500);
  }
  document.getElementById("banner-prev").onclick = () => { goToSlide(bannerIndex - 1); resetTimer(); };
  document.getElementById("banner-next").onclick = () => { goToSlide(bannerIndex + 1); resetTimer(); };
  resetTimer();

  function makeSubView(id, title) {
    const view = document.createElement("div");
    view.className = "view";
    view.id = id;
    const topbar = document.createElement("div");
    topbar.className = "sub-topbar";
    const backBtn = document.createElement("button");
    backBtn.className = "back-btn";
    backBtn.textContent = "← ホーム";
    backBtn.onclick = () => showView("home-view");
    const titleEl = document.createElement("div");
    titleEl.className = "sub-title";
    titleEl.textContent = title;
    topbar.appendChild(backBtn);
    topbar.appendChild(titleEl);
    const frameWrap = document.createElement("div");
    frameWrap.className = "sub-frame-wrap";
    const iframe = document.createElement("iframe");
    frameWrap.appendChild(iframe);
    view.appendChild(topbar);
    view.appendChild(frameWrap);
    root.appendChild(view);
    return { view, iframe };
  }

  const roomsSub = makeSubView("rooms-view", "部屋割り");
  const networkSub = makeSubView("network-view", "相関図");
  const masterSub = makeSubView("master-view", "刀剣男士");

  let roomsLoaded = false, networkLoaded = false, masterLoaded = false;
  let activityLog = [];

  const SHARED_CHAR_NAMES = [
    "山姥切国広","歌仙兼定","加州清光","陸奥守吉行","蜂須賀虎徹",
    "堀川国広","薬研藤四郎","髭切","膝丸","一期一振"
  ];
  let sharedCharacters = SHARED_CHAR_NAMES.map((n, i) => ({
    id: "c" + i, name: n, swordType: "", activationDate: "", unit: ""
  }));

  const APP_STORAGE_KEY = "saniwa-tool.app.v1";
  try {
    const saved = JSON.parse(localStorage.getItem(APP_STORAGE_KEY));
    if (saved && Array.isArray(saved.activityLog)) activityLog = saved.activityLog;
    if (saved && Array.isArray(saved.sharedCharacters)) sharedCharacters = saved.sharedCharacters;
  } catch (e) {}
  function saveAppState() {
    try {
      localStorage.setItem(APP_STORAGE_KEY, JSON.stringify({ activityLog, sharedCharacters }));
    } catch (e) {}
  }
  window.addEventListener("pagehide", saveAppState);

  function broadcastCharacters() {
    [roomsSub, networkSub, masterSub].forEach(sub => {
      try {
        sub.iframe.contentWindow && sub.iframe.contentWindow.postMessage(
          { type: "characters_sync", characters: sharedCharacters }, "*"
        );
      } catch (e) {}
    });
  }

  function renderFeed() {
    const list = document.getElementById("feed-list");
    if (!list) return;
    if (activityLog.length === 0) {
      list.innerHTML = `<div class="feed-empty">まだ更新はありません。部屋割りや相関図を触ると、ここに履歴が表示されます。</div>`;
      return;
    }
    list.innerHTML = "";
    activityLog.forEach(item => {
      const row = document.createElement(item.url ? "a" : "div");
      row.className = "feed-item" + (item.url ? " linked" : "");
      if (item.url) {
        row.href = item.url;
        row.target = "_blank";
        row.rel = "noopener";
        row.style.textDecoration = "none";
        row.style.color = "inherit";
      }
      const icon = document.createElement("div");
      icon.className = "feed-icon " + item.source;
      icon.textContent = item.source === "rooms" ? "丸" : item.source === "network" ? "縁" : item.source === "master" ? "刀" : "X";
      const text = document.createElement("div");
      text.className = "feed-text";
      text.textContent = item.text;
      const time = document.createElement("div");
      time.className = "feed-time";
      time.textContent = item.time;
      row.appendChild(icon);
      row.appendChild(text);
      row.appendChild(time);
      list.appendChild(row);
    });
  }

  window.addEventListener("message", e => {
    const data = e.data;
    if (!data || !data.source) return;
    if (data.source !== "rooms" && data.source !== "network" && data.source !== "master") return;

    if (data.type === "ready") {
      try { e.source && e.source.postMessage({ type: "characters_sync", characters: sharedCharacters }, "*"); } catch (err) {}
      return;
    }
    if (data.type === "character_update" && data.character) {
      const idx = sharedCharacters.findIndex(c => c.id === data.character.id);
      if (idx === -1) {
        sharedCharacters.push(Object.assign(
          { id: data.character.id, name: data.character.name, swordType: "", activationDate: "", unit: "" },
          data.character
        ));
      } else {
        sharedCharacters[idx] = Object.assign({}, sharedCharacters[idx], data.character);
      }
      broadcastCharacters();
      saveAppState();
    }
    if (!data.text) return;
    const now = new Date();
    const time = now.getHours().toString().padStart(2, "0") + ":" + now.getMinutes().toString().padStart(2, "0");
    activityLog.unshift({ source: data.source, text: data.text, time });
    if (activityLog.length > 30) activityLog.length = 30;
    renderFeed();
    saveAppState();
  });

  renderFeed();

  const feedAddToggle = document.getElementById("feed-add-toggle");
  const feedAddForm = document.getElementById("feed-add-form");
  feedAddToggle.onclick = () => feedAddForm.classList.toggle("open");

  document.getElementById("feed-add-submit").onclick = () => {
    const account = document.getElementById("feed-add-account").value;
    const textEl = document.getElementById("feed-add-text");
    const urlEl = document.getElementById("feed-add-url");
    const text = textEl.value.trim();
    if (!text) return;
    const now = new Date();
    const time = now.getHours().toString().padStart(2, "0") + ":" + now.getMinutes().toString().padStart(2, "0");
    activityLog.unshift({ source: "x", text: `[${account}] ${text}`, time, url: urlEl.value.trim() || null });
    if (activityLog.length > 30) activityLog.length = 30;
    textEl.value = "";
    urlEl.value = "";
    feedAddForm.classList.remove("open");
    renderFeed();
    saveAppState();
  };

  function showView(id) {
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    if (id === "rooms-view" && !roomsLoaded) {
      roomsSub.iframe.srcdoc = b64ToUtf8(document.getElementById("tmpl-rooms").textContent);
      roomsLoaded = true;
    }
    if (id === "network-view" && !networkLoaded) {
      networkSub.iframe.srcdoc = b64ToUtf8(document.getElementById("tmpl-network").textContent);
      networkLoaded = true;
    }
    if (id === "master-view" && !masterLoaded) {
      masterSub.iframe.srcdoc = b64ToUtf8(document.getElementById("tmpl-master").textContent);
      masterLoaded = true;
    }
  }

  document.getElementById("open-rooms").onclick = () => showView("rooms-view");
  document.getElementById("open-network").onclick = () => showView("network-view");
  document.getElementById("open-master").onclick = () => showView("master-view");
})();
</script>
</body>
</html>
