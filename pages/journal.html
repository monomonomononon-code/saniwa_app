<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2EBDD">
  <title>日報・日誌 | 審神者管理ツール</title>
  <link rel="stylesheet" href="../assets/journal.css?v=diary-2">
  <link rel="stylesheet" href="../assets/report.css?v=timeline-1">
  <link rel="stylesheet" href="../assets/diary.css?v=compact-buttons-9">
  <link rel="stylesheet" href="../assets/diary-reference.css?v=quotes-6">
</head>
<body>
  <main id="app">
    <section id="journal-menu" aria-labelledby="menu-title">
      <header class="header">
        <h1 id="menu-title"><span class="seal" aria-hidden="true">記</span>日報</h1>
        <p>記録する内容を選択してください。</p>
      </header>
      <nav class="record-menu" aria-label="記録メニュー">
        <a class="record-button" href="#report">
          <span class="record-icon" aria-hidden="true">報</span>
          <span class="record-copy"><strong>日報</strong><small>経験値、資材、周回数、成果</small></span>
        </a>
        <a class="record-button" href="#diary">
          <span class="record-icon" aria-hidden="true">誌</span>
          <span class="record-copy"><strong>日誌</strong><small>本日の出来事、短文メモ、創作寄りの記録</small></span>
        </a>
      </nav>
    </section>
    <section id="journal-detail" aria-labelledby="detail-title" hidden>
      <a class="menu-back" href="#menu">← 日報メニュー</a>
      <header class="header">
        <h1 id="detail-title" tabindex="-1"><span class="seal" id="detail-glyph" aria-hidden="true">報</span><span id="detail-name">日報</span></h1>
        <p id="detail-description">経験値、資材、周回数、成果</p>
      </header>
      <div id="report-app">
        <section class="report-calendar" aria-label="月間カレンダー">
          <div class="report-month-nav">
            <button id="report-prev-month" type="button" aria-label="前の月">‹</button>
            <h2 id="report-month-title" aria-live="polite"></h2>
            <button id="report-next-month" type="button" aria-label="次の月">›</button>
          </div>
          <div class="report-weekdays" aria-hidden="true"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
          <div id="report-calendar-grid" class="report-calendar-grid"></div>
        </section>
        <section class="report-day" aria-labelledby="report-selected-date">
          <div class="report-day-head">
            <h2 id="report-selected-date"></h2>
            <button id="report-edit" class="report-primary" type="button">編集</button>
          </div>
          <div id="report-day-content"></div>
        </section>
      </div>
    </section>
    <section id="diary" aria-label="日誌" hidden>
      <a id="diary-menu-back" class="menu-back" href="#menu">← 日報メニュー</a>
      <p id="diary-status" class="diary-status" role="status" aria-live="polite"></p>
      <div id="diary-works">
        <div class="diary-toolbar"><h2>作品一覧</h2><button id="diary-new-work" class="diary-primary" type="button">＋ 新規作品</button></div>
        <div id="diary-work-list" class="diary-list"></div>
      </div>
      <div id="diary-chapters" hidden>
        <button id="diary-back-works" class="menu-back" type="button">← 作品一覧</button>
        <h2 id="diary-work-title" tabindex="-1"></h2>
        <p id="diary-work-total" class="diary-meta"></p>
        <div id="diary-chapter-list" class="diary-list"></div>
        <button id="diary-add-chapter" class="diary-add" type="button">＋ 章を追加</button>
      </div>
      <div id="diary-editor" hidden>
        <div class="diary-editor-header">
        <button id="diary-back-chapters" class="menu-back" type="button"></button>
        <div id="diary-chapter-title-display" class="diary-title-row">
          <h2><button id="diary-chapter-heading" type="button" aria-expanded="false" aria-controls="diary-chapter-title-edit" title="タイトルを編集"></button></h2>
          <div id="diary-chapter-title-edit" class="diary-title-popup" role="region" aria-label="タイトルを編集" hidden>
            <label for="diary-chapter-title">タイトルを編集</label>
            <input id="diary-chapter-title" type="text" placeholder="章タイトル">
            <p id="diary-title-error" role="alert" class="diary-meta"></p>
            <div class="diary-editor-actions">
              <button id="diary-title-done" class="diary-primary" type="button">保存</button>
              <button id="diary-title-close" class="diary-primary" type="button">閉じる</button>
            </div>
          </div>
        </div>
        <button id="diary-save" class="diary-primary" type="button">保存</button>
        </div>
        <p id="diary-char-count" class="diary-meta diary-count-row">0文字</p>
        <hr class="diary-body-divider">
        <textarea id="diary-body" aria-label="本文" placeholder="本文を入力してください"></textarea>
        <div id="diary-insert-slot">
        <div id="diary-inserts" class="diary-inserts" aria-label="文字を挿入">
          <button id="diary-insert-brackets" type="button" aria-label="かぎ括弧を挿入">「」</button>
          <button id="diary-insert-dash" type="button" aria-label="ダッシュを挿入">―</button>
          <button id="diary-insert-ellipsis" type="button" aria-label="三点リーダーを挿入">…</button>
          <button id="diary-insert-space" type="button" aria-label="全角スペースを挿入">␣</button>
          <button type="button" data-reference="rooms" aria-haspopup="dialog">部屋</button>
          <button type="button" data-reference="network" aria-haspopup="dialog">関係</button>
          <button type="button" data-reference="master" aria-haspopup="dialog">刀剣</button>
        </div>
        </div>
      </div>
      <p class="diary-meta">入力内容はこの端末・ブラウザに保存されます。他の利用者には共有されません。</p>
    </section>
  </main>
  <div id="report-editor-overlay" class="report-modal-overlay" hidden>
    <section id="report-editor" class="report-modal" role="dialog" aria-modal="true" aria-labelledby="report-editor-title" tabindex="-1">
      <header class="report-modal-head">
        <div><span class="report-modal-kicker">日報を編集</span><h2 id="report-editor-title"></h2></div>
        <button id="report-editor-close" type="button">閉じる</button>
      </header>
      <div class="report-modal-body">
        <section class="report-form-section">
          <h3>日課</h3>
          <div id="report-task-list" class="report-check-list"></div>
        </section>
        <section class="report-form-section">
          <h3>入手した刀剣男士</h3>
          <div class="report-add-row report-obtained-row">
            <input id="report-sword-name" type="text" placeholder="刀剣男士の名前" aria-label="刀剣男士の名前">
            <input id="report-sword-count" type="number" inputmode="numeric" min="1" step="1" value="1" aria-label="入手数">
            <button id="report-add-sword" type="button">追加</button>
          </div>
          <div id="report-obtained-list" class="report-edit-list"></div>
        </section>
        <section class="report-form-section">
          <h3>資材・札の収支</h3>
          <p class="report-help">日課分はチェック状態から自動で計算されます。</p>
          <div id="report-resource-editor" class="report-resource-editor"></div>
        </section>
        <section class="report-form-section">
          <h3>イベント周回</h3>
          <div class="report-add-row">
            <select id="report-event-name" aria-label="イベント名"></select>
            <input id="report-event-rounds" type="number" inputmode="numeric" min="1" step="1" placeholder="周回数" aria-label="イベント周回数">
            <button id="report-add-event" type="button">追加</button>
          </div>
          <div id="report-event-list" class="report-edit-list"></div>
        </section>
        <section class="report-form-section">
          <h3>通常マップ周回</h3>
          <div class="report-add-row">
            <select id="report-map-name" aria-label="通常マップ"></select>
            <input id="report-map-rounds" type="number" inputmode="numeric" min="1" step="1" placeholder="周回数" aria-label="通常マップ周回数">
            <button id="report-add-map" type="button">追加</button>
          </div>
          <div id="report-map-list" class="report-edit-list"></div>
        </section>
        <section class="report-form-section">
          <h3>小判の収支</h3>
          <label class="report-single-input">手入力<input id="report-koban" type="number" inputmode="numeric" step="1" placeholder="例：3000 または -1500"></label>
          <div class="report-koban-tools">
            <div class="report-koban-buttons" aria-label="小判を加算">
              <button type="button" data-koban-add="200">＋200</button>
              <button type="button" data-koban-add="400">＋400</button>
              <button type="button" data-koban-add="700">＋700</button>
            </div>
            <label class="report-koban-campaign"><input id="report-koban-triple" type="checkbox">3倍CP</label>
          </div>
          <div id="report-koban-total" class="report-auto-total"></div>
        </section>
        <section class="report-form-section">
          <h3>経験値計算機からの記録</h3>
          <div id="report-exp-editor-list" class="report-edit-list"></div>
        </section>
      </div>
      <footer class="report-modal-actions">
        <button id="report-save" class="report-primary" type="button">保存</button>
      </footer>
    </section>
  </div>
  <div id="diary-reference-overlay" hidden>
    <section id="diary-reference-sheet" role="dialog" aria-modal="true" aria-labelledby="diary-reference-title" tabindex="-1">
      <div id="diary-reference-handle" aria-hidden="true"><span></span></div>
      <header class="reference-header"><h2 id="diary-reference-title"></h2><button id="diary-reference-close" type="button">閉じる</button></header>
      <div id="diary-reference-content" tabindex="0"></div>
    </section>
  </div>
  <script src="../assets/storage-registry.js?v=domains-1"></script>
  <script src="../assets/experience-calculator.js?v=report-catalog-1"></script>
  <script src="../assets/report-data.js?v=calendar-1"></script>
  <script src="../assets/report.js?v=timeline-1"></script>
  <script src="../assets/diary.js?v=title-popup-5"></script>
  <script src="../assets/diary-keyboard.js?v=references-11"></script>
  <script src="../assets/journal.js?v=writing-3"></script>
  <script src="../assets/diary-reference.js?v=quotes-6"></script>
</body>
</html>
