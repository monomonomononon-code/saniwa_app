          const neck = box(.06, .04, .06, cap);
          neck.position.set(x, y + h + .02, z);
          g.add(neck);
          const knob = new THREE.Mesh(GEO.puff(), cap); // 擬宝珠(玉ねぎ形の頭)
          knob.scale.set(.075, .095, .075);
          knob.position.set(x, y + h + .09, z);
          g.add(knob);
        });
      });
      // 両端の踏み石(橋の幅より少し狭くして、地面を覆いすぎないようにする)
      [-1, 1].forEach(side => {
        const step = box(.42, .1, W * .8, ctx.mat(P.stone));
        step.position.set(side * (L / 2 + .16), .05, 0);
        g.add(step);
      });
    },
    stone(item, g, ctx) {
      // 石: 頂点をずらした不規則な低ポリ岩を大小 3〜4個。丸くならないよう軸ごとに違う倍率をかける
      const P = ctx.season.palette;
      const n = ctx.w * ctx.d > 1.1 ? 4 : 3;
      const spots = [[-.16, .02, 1], [.24, -.2, .62], [.1, .28, .5], [-.3, -.28, .38]];
      for (let i = 0; i < n; i++) {
        const [fx, fz, scale] = spots[i];
        const rock = new THREE.Mesh(GEO.rock(i), ctx.mat(i % 2 ? P.stone : P.stoneDark));
        const base = Math.min(ctx.w, ctx.d) * .5 * scale;
        rock.scale.set(
          base * (.9 + ctx.rand() * .5),
          base * (.5 + ctx.rand() * .45),
          base * (.85 + ctx.rand() * .5)
        );
        rock.position.set(fx * ctx.w, rock.scale.y * .42, fz * ctx.d);
        rock.rotation.set((ctx.rand() - .5) * .5, ctx.rand() * Math.PI, (ctx.rand() - .5) * .5);
        ctx.pick(rock);
      }
    },
    petals(item, g, ctx) {
      // 花びらの絨毯: 風下に吹き寄せられた模様のテクスチャ + 立体の花びらを少しだけ重ねる
      const P = ctx.season.palette;
      const sheet = new THREE.Mesh(GEO.plane(), petalSheetMaterial(P.petal, P.petalDeep));
      sheet.rotation.x = -Math.PI / 2;
      sheet.scale.set(ctx.w, ctx.d, 1);
      sheet.position.y = .012;
      ctx.pick(sheet);
      scatterDiscs(g, ctx, {
        count: Math.min(ctx.lod ? 14 : 7, Math.round(ctx.w * ctx.d * 2)), y: .02, radius: .075,
        w: ctx.w * .8, d: ctx.d * .8, cluster: .5,
        bias: { x: WIND.x * ctx.w * .16, z: WIND.z * ctx.d * .16 },
        colors: [P.petal, P.petalDeep, P.sakuraLight]
      });
    },
    field(item, g, ctx) {
      const soil = box(ctx.w, .14, ctx.d, lambert(0x765139));
      soil.position.y = -.08;
      ctx.pick(soil);
      const rows = 5;
      for (let i = 0; i < rows; i++) {
        const ridge = box(ctx.w * .88, .13, Math.max(.12, ctx.d / 12), lambert(0x9A6B42));
        ridge.position.set(0, .05, -ctx.d * .34 + i * ctx.d * .17);
        g.add(ridge);
      }
    },
    stable(item, g, ctx) {
      const wood = lambert(0x7A4B32);
      const dark = lambert(0x4F3020);
      const base = box(ctx.w, .18, ctx.d, wood);
      base.position.y = 0;
      ctx.pick(base);
      const back = box(ctx.w, 1.45, .16, wood);
      back.position.set(0, .78, -ctx.d / 2 + .08);
      ctx.pick(back);
      [-ctx.w / 2 + .1, ctx.w / 2 - .1].forEach(x => {
        const side = box(.18, 1.45, ctx.d, wood);
        side.position.set(x, .78, 0);
        ctx.pick(side);
      });
      const roof = box(ctx.w + .45, .22, ctx.d + .45, dark);
      roof.position.y = 1.62;
      ctx.pick(roof);
    },
    tree(item, g, ctx) {
      // 樹木: 幹 + 樹冠(props.shape = "round" | "cone")。丸型は葉の塊を寄せて輪郭に凹凸を出す
      const P = ctx.season.palette;
      const s = Math.max(.4, ctx.w / 1.6);
      const cone = (item.props && item.props.shape) === "cone";
      const trunk = new THREE.Mesh(GEO.trunk(), ctx.mat(P.trunkDark));
      trunk.scale.set(.15 * s, 1.25 * s, .15 * s);
      trunk.position.y = .62 * s;
      ctx.pick(trunk);
      if (cone) {
        [[0, 1.05, .8, .95], [0, 1.75, .62, .8], [0, 2.35, .42, .6]].forEach(([x, y, r, h], i) => {
          const tier = new THREE.Mesh(new THREE.ConeGeometry(r * s, h * s, 9), ctx.mat(i % 2 ? P.canopyDeep : P.canopy));
          tier.position.set(x, y * s, 0);
          ctx.pick(tier);
        });
      } else {
        [[0, 1.65, .74, P.canopy], [-.42, 1.4, .5, P.canopyDeep], [.44, 1.45, .48, P.canopy],
         [.06, 2.05, .44, P.canopy], [.02, 1.5, .45, P.canopyDeep]].forEach(([x, y, r, c], i) => {
          const lump = new THREE.Mesh(GEO.puff(), ctx.mat(c));
          lump.scale.set(r * s, r * s * .88, r * s);
          lump.position.set(x * s, y * s, (i === 1 ? .3 : i === 2 ? -.28 : .04) * s);
          ctx.pick(lump);
        });
      }
    },
    // ---- 植栽(春): デフォルメした低ポリ表現。球・円柱は共有ジオメトリを拡縮して使う ----
    sakura(item, g, ctx) {
      // 桜: 根元から二又に分かれる幹 + 4本の枝 + 枝先ごとの花房。
      // 1つの球で覆わず房を分けることで、輪郭がぼこぼこした「あつ森風」の桜になる
      const P = ctx.season.palette;
      const s = Math.max(.5, ctx.w / 2);
      const bark = ctx.mat(P.trunk), barkDark = ctx.mat(P.trunkDark);
      const V = (x, y, z) => new THREE.Vector3(x * s, y * s, z * s);
      // 幹(下は太く、途中で少し傾ぐ)
      const forkAt = V(.06, .95, -.02);
      ctx.pick(limb(g, barkDark, V(0, 0, 0), forkAt, .17 * s, 1));
      // 二又の主枝
      const armA = V(-.5, 1.62, .12), armB = V(.62, 1.5, -.16);
      ctx.pick(limb(g, bark, forkAt, armA, .1 * s));
      ctx.pick(limb(g, bark, forkAt, armB, .11 * s));
      ctx.pick(limb(g, bark, forkAt, V(.05, 1.85, .1), .09 * s));
      // 枝先(花房の中心)。位置・大きさ・色を散らして房を分ける
      const clusters = [
        { at: V(-.78, 1.95, .2),  r: .62, c: P.sakura },
        { at: V(-.3, 2.25, -.35), r: .55, c: P.sakuraLight },
        { at: V(.85, 1.92, -.3),  r: .6,  c: P.sakuraDeep },
        { at: V(.45, 2.3, .42),   r: .58, c: P.sakura },
        { at: V(.02, 2.55, -.05), r: .5,  c: P.sakuraLight },
        { at: V(-.15, 1.75, .6),  r: .45, c: P.sakuraDeep }
      ];
      clusters.forEach((cl, i) => {
        // 枝を花房まで伸ばす
        const from = i % 2 ? armB : armA;
        limb(g, bark, from, cl.at, .05 * s);
        // 1房 = 大きい球 + 小さい球2つ(輪郭に凹凸を作る)
        const main = new THREE.Mesh(GEO.puff(), ctx.mat(cl.c));
        main.scale.set(cl.r * s, cl.r * s * .78, cl.r * s * .95);
        main.position.copy(cl.at);
        ctx.pick(main);
        for (let k = 0; k < (ctx.lod ? 2 : 1); k++) {
          const sub = new THREE.Mesh(GEO.puff(), ctx.mat(k ? P.sakuraLight : cl.c));
          const sr = cl.r * (.5 + ctx.rand() * .22);
          sub.scale.set(sr * s, sr * s * .72, sr * s * .9);
          sub.position.set(
            cl.at.x + (ctx.rand() - .5) * cl.r * s * 1.5,
            cl.at.y + (ctx.rand() - .35) * cl.r * s * .8,
            cl.at.z + (ctx.rand() - .5) * cl.r * s * 1.5
          );
          ctx.pick(sub);
        }
      });
      // 根元に散った花びら(均一にせず風下へ寄せる)
      if (ctx.season.effects.petals) {
        scatterDiscs(g, ctx, {
          count: ctx.lod ? 12 : 6, y: .012, radius: .075, w: 2.6 * s, d: 2.6 * s, cluster: .35,
          bias: { x: WIND.x * .5 * s, z: WIND.z * .5 * s },
          colors: [P.petal, P.petalDeep, P.sakuraLight]
        });
      }
    },
    pine(item, g, ctx) {
      // 松: 曲がった幹 + 横へ大きく張り出す枝 + 段に分かれた平たい葉叢(和風の仕立て)
      const P = ctx.season.palette;
      const s = Math.max(.5, ctx.w / 1.8);
      const bark = ctx.mat(P.trunkDark);
      const V = (x, y, z) => new THREE.Vector3(x * s, y * s, z * s);
      // 幹: 3節でくねらせる
      const k1 = V(-.12, .62, .05), k2 = V(.14, 1.24, -.06), top = V(-.02, 1.72, .04);
      ctx.pick(limb(g, bark, V(.02, 0, 0), k1, .15 * s, 1));
      ctx.pick(limb(g, bark, k1, k2, .12 * s, 1));
      ctx.pick(limb(g, bark, k2, top, .09 * s, 1));
      // 枝と葉叢: 高さごとに左右へ大きく張り出す
      const tiers = [
        { from: k1, to: V(-1.0, .95, .28),  r: .62, h: .2,  c: P.pineDark },
        { from: k2, to: V(1.02, 1.42, -.2), r: .58, h: .19, c: P.pine },
        { from: k2, to: V(-.72, 1.62, -.5), r: .46, h: .16, c: P.pineDark },
        { from: top, to: V(.5, 1.95, .45),  r: .42, h: .15, c: P.pine },
        { from: top, to: V(-.05, 2.15, 0),  r: .4,  h: .16, c: P.pineLight }
      ];
      tiers.forEach(t => {
        limb(g, bark, t.from, t.to, .055 * s);
        // 葉叢は平たい球を2〜3枚重ねて「段」に見せる
        const layers = ctx.lod ? [[0, 0, 1], [.22, .1, .66], [-.2, .12, .58]] : [[0, 0, 1], [.2, .1, .62]];
        layers.forEach(([dx, dy, f], i) => {
          const pad = new THREE.Mesh(GEO.puff(), ctx.mat(i === 2 ? P.pineLight : t.c));
          pad.scale.set(t.r * f * s, t.h * f * s, t.r * f * s * .92);
          pad.position.set(t.to.x + dx * s * .5, t.to.y + dy * s * .5, t.to.z + (i === 1 ? .18 : -.14) * s * .5);
          ctx.pick(pad);
        });
      });
    },
    bamboo(item, g, ctx) {
      // 竹: 節で区切った稈 + 節ごとの輪 + 上部に細い葉。節と葉をはっきり見せる
      const P = ctx.season.palette;
      const n = Math.max(3, Math.min(7, Math.round(ctx.w / .3)));
      const culmMat = ctx.mat(P.bamboo), nodeMat = ctx.mat(P.bambooNode);
      const leafMat = ctx.mat(P.bambooLeaf, { side: THREE.DoubleSide });
      const leafDark = ctx.mat(P.bambooNode, { side: THREE.DoubleSide });
      for (let i = 0; i < n; i++) {
        const ang = (i / n) * Math.PI * 2 + ctx.rand() * .8;
        const dist = (.12 + ctx.rand() * .3);
        const x = Math.cos(ang) * dist * ctx.w, z = Math.sin(ang) * dist * ctx.d;
        const h = 2.5 + ctx.rand() * 1.5;
        const r = .05 + ctx.rand() * .015;
        const joints = Math.max(4, Math.round(h / .55));
        const lean = (ctx.rand() - .5) * .1;
        // 節間ごとに少しずつ細くする
        for (let k = 0; k < joints; k++) {
          const y0 = h * k / joints, y1 = h * (k + 1) / joints;
          const rk = r * (1 - k / joints * .35);
          const seg = new THREE.Mesh(GEO.stick(), culmMat);
          seg.scale.set(rk, (y1 - y0) * .93, rk);
          seg.position.set(x + lean * y0, (y0 + y1) / 2, z);
          seg.rotation.z = lean;
          ctx.pick(seg);
          // 節の輪(少し太く濃い)
          const ring = new THREE.Mesh(GEO.stick(), nodeMat);
          ring.scale.set(rk * 1.35, .045, rk * 1.35);
          ring.position.set(x + lean * y1, y1, z);
          ring.rotation.z = lean;
          g.add(ring);
        }
        // 葉: 上の節から扇状に(スマホでは枚数を減らす)
        const leafRows = ctx.lod ? 3 : 2, leafFan = ctx.lod ? 3 : 2;
        for (let k = 0; k < leafRows; k++) {
          const ly = h - .3 - k * .45;
          for (let j = 0; j < leafFan; j++) {
            const leaf = new THREE.Mesh(GEO.leaf(), j === 1 ? leafDark : leafMat);
            leaf.scale.set(.5 + ctx.rand() * .2, .26, 1);
            leaf.position.set(x + lean * ly, ly, z);
            // (ひねり, 向き, 垂れ具合)。少し上を向かせて真上から見ても葉の形が分かるようにする
            leaf.rotation.order = "YXZ";
            leaf.rotation.set(-1.05 - ctx.rand() * .4, k * 2.1 + j * 1.9 + ctx.rand() * .5, -.12 - ctx.rand() * .35);
            g.add(leaf);
          }
        }
      }
    },
    shrub(item, g, ctx) {
      // 低木: 大小の葉の塊を6つ重ねて、輪郭に凹凸のある茂みにする
      const P = ctx.season.palette;
      const sw = ctx.w / 1.2, sd = ctx.d / .9, sy = Math.min(sw, sd);
      const lumps = [
        [0, .42, -.05, .52, P.shrub],
        [-.42, .32, .12, .4, P.shrubDeep],
        [.4, .3, -.14, .38, P.shrub],
        [.16, .58, .2, .34, P.shrubDeep],
        [-.2, .6, -.18, .3, P.shrub],
        [.02, .74, .02, .24, P.shrubDeep]
      ];
      lumps.forEach(([x, y, z, r, c]) => {
        const lump = new THREE.Mesh(GEO.puff(), ctx.mat(c));
        lump.scale.set(r * sw, r * sy * .95, r * sd);
        lump.position.set(x * sw, y * sy * .9, z * sd);
        ctx.pick(lump);
      });
      // 足元の葉(茂みの裾を隠して自然に見せる)
      for (let i = 0; i < (ctx.lod ? 5 : 3); i++) {
        const blade = new THREE.Mesh(GEO.leaf(), ctx.mat(P.shrubDeep, { side: THREE.DoubleSide }));
        blade.scale.set(.3, .24, 1);
        blade.position.set((ctx.rand() - .5) * sw * .9, .06, (ctx.rand() - .5) * sd * .9);
        blade.rotation.order = "YXZ";
        blade.rotation.set(-1.35, ctx.rand() * Math.PI * 2, .12);
        g.add(blade);
      }
      if (ctx.season.effects.petals) {
        for (let i = 0; i < (ctx.lod ? 7 : 4); i++) {
          const bloom = new THREE.Mesh(GEO.puff(), ctx.mat(i % 3 ? P.shrubBloom : P.sakuraLight));
          const br = .055 + ctx.rand() * .03;
          bloom.scale.setScalar(br);
          const ang = ctx.rand() * Math.PI * 2, rad = .3 + ctx.rand() * .2;
          bloom.position.set(Math.cos(ang) * rad * sw, .35 * sy + ctx.rand() * .45 * sy, Math.sin(ang) * rad * sd);
          g.add(bloom);
        }
      }
    },
    flowers(item, g, ctx) {
      // 花: 高さ・大きさ・色をばらけさせ、数株ずつ寄せて咲かせる
      const P = ctx.season.palette;
      // 下地は四角いタイルに見えないよう、六角形の低い花壇にする
      const bed = new THREE.Mesh(GEO.disc(), ctx.mat(P.shrub));
      bed.rotation.x = -Math.PI / 2;
      bed.scale.set(ctx.w * .48, ctx.d * .48, 1);
      bed.position.y = .015;
      ctx.pick(bed);
      const clumps = Math.max(2, Math.min(ctx.lod ? 6 : 4, Math.round(ctx.w * ctx.d * 2.2)));
      const stemMat = ctx.mat(P.lily);
      const leafMat = ctx.mat(P.lily, { side: THREE.DoubleSide });
      for (let c = 0; c < clumps; c++) {
        const cx = (ctx.rand() - .5) * ctx.w * .78, cz = (ctx.rand() - .5) * ctx.d * .78;
        const color = P.flowers[Math.floor(ctx.rand() * P.flowers.length)];
        const n = 2 + Math.floor(ctx.rand() * 3);
        for (let i = 0; i < n; i++) {
          const x = cx + (ctx.rand() - .5) * .3, z = cz + (ctx.rand() - .5) * .3;
          const h = .18 + ctx.rand() * .28;           // 背丈をばらす
          const tilt = (ctx.rand() - .5) * .22;
          const stem = new THREE.Mesh(GEO.stick(), stemMat);
          stem.scale.set(.016, h, .016);
          stem.position.set(x + tilt * h * .5, .05 + h / 2, z);
          stem.rotation.z = tilt;
          g.add(stem);
          const head = new THREE.Mesh(GEO.puff(), ctx.mat(ctx.rand() < .25 ? P.sakuraLight : color));
          const hr = .06 + ctx.rand() * .045;         // 花の大きさもばらす
          head.scale.set(hr, hr * .85, hr);
          head.position.set(x + tilt * h, .05 + h, z);
          g.add(head);
        }
        // 株元の葉
        for (let i = 0; i < (ctx.lod ? 2 : 1); i++) {
          const blade = new THREE.Mesh(GEO.leaf(), leafMat);
          blade.scale.set(.24, .18, 1);
          blade.position.set(cx, .06, cz);
          blade.rotation.order = "YXZ";
          blade.rotation.set(-1.3, ctx.rand() * Math.PI * 2, .15);
          g.add(blade);
        }
      }
    },
    tansu(item, g, ctx) {
      // 箪笥: 木箱 + 引き出しの筋 + 金具
      const H = 1.2;
      const body = box(ctx.w, H, ctx.d, lambert(0x7A4B32));
      body.position.y = H / 2;
      ctx.pick(body);
      for (let i = 1; i < 4; i++) {
        const line = box(ctx.w + .01, .02, ctx.d + .01, lambert(0x4F3020));
        line.position.y = i * (H / 4);
        g.add(line);
      }
      for (let i = 0; i < 4; i++) {
        const knob = box(.08, .06, .04, lambert(0x2B2621));
        knob.position.set(0, i * (H / 4) + H / 8, ctx.d / 2 + .02);
        g.add(knob);
      }
    },
    chabudai(item, g, ctx) {
      // ちゃぶ台: 丸い天板 + 短い脚
      const r = Math.min(ctx.w, ctx.d) / 2;
      const top = new THREE.Mesh(new THREE.CylinderGeometry(r, r, .06, 24), lambert(0x8C6239));
      top.position.y = .33;
      ctx.pick(top);
      [[1, 1], [-1, 1], [1, -1], [-1, -1]].forEach(([sx, sz]) => {
        const leg = box(.06, .3, .06, lambert(0x5C3722));
        leg.position.set(sx * r * .55, .15, sz * r * .55);
        g.add(leg);
      });
    },
    futon(item, g, ctx) {
      // 三つ折りにした布団: 3段に重ねた布 + 掛け布団の色
      const layerH = .16;
      for (let i = 0; i < 3; i++) {
        const layer = box(ctx.w - i * .04, layerH, ctx.d - i * .03, lambert(i === 1 ? 0xC9D3E0 : 0xE8E4D8));
        layer.position.set(0, layerH / 2 + i * layerH, i * .02);
        ctx.pick(layer);
      }
      const trim = box(ctx.w - .1, .04, .08, lambert(0xA8382C));
      trim.position.set(0, layerH * 3 + .02, ctx.d / 2 - .1);
      g.add(trim);
    },
    sofa(item, g, ctx) {
      // ソファ: 座面 + 背もたれ + 肘掛け
      const cloth = lambert(0x8A5A4A);
      const seat = box(ctx.w, .35, ctx.d, cloth);
      seat.position.y = .175;
      ctx.pick(seat);
      const back = box(ctx.w, .5, Math.min(.2, ctx.d * .3), cloth);
      back.position.set(0, .55, -ctx.d / 2 + .1);
      ctx.pick(back);
      [-1, 1].forEach(side => {
        const arm = box(.14, .5, ctx.d, lambert(0x6E4638));
        arm.position.set(side * (ctx.w / 2 - .07), .25, 0);
        g.add(arm);
      });
    }
  };

  function buildStructure(item) {
    const def = partDef(item.type) || { label: item.type, labelY: .55 };
    const g = new THREE.Group();
    g.position.set(item.position.x, finiteNumber(item.position.y, def.y || 0), item.position.z);
    g.rotation.y = item.rotation || 0;
    g.userData = { kind: "structure", id: item.id };
    draggableGroups.set(`structure:${item.id}`, g);
    const ctx = {
      w: item.size.x, d: item.size.z, def,
      pick: mesh => tagPickable(mesh, item.id, g),
      mat: cachedMat, box,
      season: seasonCtx,                 // { key, palette, effects } 季節で色を変える部品はここを見る
      rand: seededRandom(item.id),       // 配置ごとに固定の乱数(散らばり表現用)
      lod: isMobileLayout() ? 0 : 1      // 0 = スマホ(飾りを間引いて描画数を減らす)
    };
    (PART_RENDERERS[item.type] || PART_RENDERERS.placeholder)(item, g, ctx);

    const label = makeLabelSprite(item.name, {
      font: MINCHO, weight: "600", fontSize: 30, worldHeight: .48,
      bg: "#FFFDF6", border: def.labelBorder || "#7A4B32"
    });
    label.position.set(0, def.labelY != null ? def.labelY : .55, 0);
    label.userData = { kind: "structure", id: item.id };
    g.add(label);
    pickables.push(label);
    return g;
  }

  // =====================================================================
  //  選択
  // =====================================================================
  function addRing(x, z, w, d, rotation, color, opacity) {
    const ring = new THREE.Mesh(
      new THREE.BoxGeometry(w, .08, d),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity })
    );
    ring.position.set(x, .02, z);
    ring.rotation.y = rotation || 0;
    highlightGroup.add(ring);
  }
  function applySelection() {
    disposeGroup(highlightGroup);
    highlightGroup = null;
    // スプライト拡大を戻す
    if (honmaruGroup) honmaruGroup.traverse(obj => {
      if (obj.isSprite && obj.userData.baseScale) obj.scale.copy(obj.userData.baseScale);
    });

    if (!selected) { renderPanel(null); return; }
    highlightGroup = new THREE.Group();

    if (selected.kind === "room") {
      const item = layoutCache.find(o => o.room.id === selected.id);
      if (item) addRing(item.x, item.z, item.w + .9, item.d + .9, item.rotation, 0xA8382C, .32);
    } else if (selected.kind === "structure") {
      const item = structureOf(selected.id);
      if (item) addRing(item.position.x, item.position.z, item.size.x + .5, item.size.z + .5, item.rotation, 0x3F5A70, .3);
    } else if (selected.kind === "wing") {
      const m = wingMembers(selected.id);
      m.rooms.forEach(item => addRing(item.x, item.z, item.w + .9, item.d + .9, item.rotation, 0x3F5A70, .28));
      m.structures.forEach(item => addRing(item.position.x, item.position.z, item.size.x + .5, item.size.z + .5, item.rotation, 0x3F5A70, .28));
    } else {
      const pos = charWorldPos(selected.id);
      if (pos) {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.32, 0.5, 32),
          new THREE.MeshBasicMaterial({ color: 0xA8382C, side: THREE.DoubleSide, transparent: true, opacity: 0.85 })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(pos.x, FLOOR_H + 0.03, pos.z);
        highlightGroup.add(ring);
      }
      if (honmaruGroup) honmaruGroup.traverse(obj => {
        if (obj.isSprite && obj.userData.kind === "char" && obj.userData.id === selected.id) {
          obj.scale.copy(obj.userData.baseScale).multiplyScalar(1.22);
        }
      });
    }
    scene.add(highlightGroup);
    renderPanel(selected);
  }

  function charWorldPos(charId) {
    for (const item of layoutCache) {
      const o = (item.room.occupants || []).find(x => x.charId === charId);
      if (o) {
        const localX = -item.w / 2 + (Number(o.x) || 50) / 100 * item.w;
        const localZ = -item.d / 2 + (Number(o.y) || 50) / 100 * item.d;
        const angle = item.rotation || 0;
        return {
          x: item.x + localX * Math.cos(angle) + localZ * Math.sin(angle),
          z: item.z - localX * Math.sin(angle) + localZ * Math.cos(angle),
          item
        };
      }
    }
    return null;
  }

  function setSelection(sel) {
    selected = sel;
    applySelection();
    document.getElementById("hint").classList.toggle("hidden", !!sel);
    // スマホでは、選択したらパーツドックを畳んで編集パネルの場所を空ける
    if (sel && editMode && isMobileLayout()) setDockCollapsed(true);
    if (editMode) renderWingEditor();
  }

  // =====================================================================
  //  情報/編集パネル
  // =====================================================================
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }
  function row(label, value) {
    const r = el("div", "ip-row");
    r.appendChild(el("span", null, label));
    r.appendChild(el("span", null, value));
    return r;
  }
  function wingSelect(currentId, allowNone, onChange) {
    const select = el("select", "ip-select");
    if (allowNone) {
      const none = el("option", null, "所属なし");
      none.value = "";
      select.appendChild(none);
    }
    buildingState.wings.forEach(wing => {
      const option = el("option", null, wing.name);
      option.value = wing.id;
      select.appendChild(option);
    });
    select.value = currentId || "";
    select.onchange = () => onChange(select.value || null);
    return select;
  }
  // 矢印ボタン(グリッド単位で移動)
  function arrowPad(onMove) {
    const pad = el("div", "ip-arrows");
    const cells = [
      null, ["↑", 0, -NUDGE], null,
      ["←", -NUDGE, 0], ["移動", 0, 0], ["→", NUDGE, 0],
      null, ["↓", 0, NUDGE], null
    ];
    cells.forEach(cell => {
      const b = el("button", null, cell ? cell[0] : "");
      b.type = "button";
      if (!cell) b.className = "blank";
      else if (cell[1] === 0 && cell[2] === 0) { b.className = "center"; b.disabled = true; }
      else b.onclick = () => onMove(cell[1], cell[2]);
      pad.appendChild(b);
    });
    return pad;
  }

  function renderPanel(sel) {
    if (!sel) { panelEl.classList.remove("open"); return; }
    panelEl.innerHTML = "";
    const head = el("div", "ip-head");
    const eyebrow = el("span", "ip-eyebrow");
    const close = el("button", "ip-close", "×");
    close.onclick = () => setSelection(null);
    head.appendChild(eyebrow);
    head.appendChild(close);
    panelEl.appendChild(head);

    if (sel.kind === "room") renderRoomPanel(sel, eyebrow);
    else if (sel.kind === "structure") renderStructurePanel(sel, eyebrow);
    else if (sel.kind === "wing") renderWingPanel(sel, eyebrow);
    else renderCharPanel(sel, eyebrow);
    if (panelEl.childElementCount > 1) panelEl.classList.add("open");
  }

  function renderRoomPanel(sel, eyebrow) {
    const room = rooms.find(r => r.id === sel.id);
    if (!room) { panelEl.classList.remove("open"); return; }
    const meta = metaOf(room.template);
    const layout = roomLayout(room.id);
    eyebrow.textContent = "部屋";
    const title = el("div", "ip-title");
    title.appendChild(el("span", null, room.name || meta.label));
    const type = el("span", "ip-type", meta.label);
    type.style.background = meta.plate;
    title.appendChild(type);
    panelEl.appendChild(title);
    if (room.note) panelEl.appendChild(el("div", "ip-note", room.note));
    const occ = room.occupants || [];
    panelEl.appendChild(row("棟", wingName(layout && layout.wingId)));
    panelEl.appendChild(row("住人", `${occ.length}振り`));
    const chips = el("div", "ip-chips");
    if (occ.length === 0) chips.appendChild(el("div", "ip-empty", "まだ誰もいません。部屋割りでタグをドロップすると表示されます。"));
    occ.forEach(o => {

    };

    if (editMode && layout) {

      }));

  function renderStructurePanel(sel, eyebrow) {
    const item = structureOf(sel.id);
    if (!item) { panelEl.classList.remove("open"); return; }
    const def = partDef(item.type) || { label: item.type, category: "" };
    const category = CATEGORIES.find(c => c.id === def.category);

    if (editMode) {
      const nameInput = el("input", "ip-input");
      nameInput.value = item.name;
      nameInput.setAttribute("aria-label", "名前");
      nameInput.style.marginTop = "0";
      nameInput.oninput = () => { item.name = nameInput.value || def.label; markBuildDirty(); };
      nameInput.onchange = () => commitChange();
      title.appendChild(nameInput);
    } else {
      title.textContent = item.name;
    }
    panelEl.appendChild(title);
    panelEl.appendChild(row("種類", def.label));
    panelEl.appendChild(row("大きさ", `${item.size.x.toFixed(2)} × ${item.size.z.toFixed(2)}`));

    const focusActions = el("div", "ip-actions");

    wingRow.appendChild(el("span", null, "所属する棟(棟ごと移動の対象)"));

    panelEl.appendChild(wingRow);

    if (item.type === "tree") {
      const shapeRow = el("div", "ip-row stack");
      shapeRow.appendChild(el("span", null, "樹形"));
      const shape = el("select", "ip-select");
      [["round", "丸い樹冠"], ["cone", "円錐の樹冠"]].forEach(([v, l]) => { const o = el("option", null, l); o.value = v; shape.appendChild(o); });
      shape.value = (item.props && item.props.shape) || "round";
      shape.onchange = () => { item.props = Object.assign({}, item.props, { shape: shape.value }); commitChange(); };
      shapeRow.appendChild(shape);
      panelEl.appendChild(shapeRow);

    const step = def.sizeStep || .75;
    const editActions = el("div", "ip-mini-actions");
    const rotate = el("button", null, "90°回転");
    rotate.onclick = () => rotateSelection();
    editActions.appendChild(rotate);
    [
      ["横 −", "x", -step], ["横 ＋", "x", step],
      ["奥行 −", "z", -step], ["奥行 ＋", "z", step]

      button.onclick = () => resizeStructure(item.id, axis, amount);

      const button = el("button", null, label);
      button.onclick = () => { item.position.y = Math.max(-1, Math.min(6, snap(finiteNumber(item.position.y, def.y || 0) + amount))); commitChange(); };

    panelEl.appendChild(editActions);

      item.position.x = snap(item.position.x + dx);
      item.position.z = snap(item.position.z + dz);

  // =====================================================================
  //  パーツドック(カテゴリタブ + パーツ一覧 + 棟一覧)

  function renderPalette() {
    const tabs = document.getElementById("part-tabs");
    const list = document.getElementById("part-list");
    const note = document.getElementById("part-note");
    tabs.innerHTML = "";
    list.innerHTML = "";
    CATEGORIES.forEach(cat => {
      const tab = el("button", "dock-tab" + (cat.id === activeCategory ? " active" : ""), cat.label);
      tab.type = "button";
      tab.onclick = () => { activeCategory = cat.id; renderPalette(); };
      tabs.appendChild(tab);
    });
    const cat = CATEGORIES.find(c => c.id === activeCategory) || CATEGORIES[0];
    note.textContent = cat.note || "";
    note.style.display = cat.note ? "" : "none";
    if (cat.id === "room") {
      Object.keys(TEMPLATE_META).forEach(key => {
        const meta = TEMPLATE_META[key];
        list.appendChild(partButton(meta.label, meta.plate, meta.label.slice(0, 1), () => requestRoom(key)));
      });
    } else {
      PART_DEFS.filter(d => d.category === cat.id).forEach(def => {
        list.appendChild(partButton(def.label, def.color, def.glyph || def.label.slice(0, 1), () => addStructure(def.type)));
      });
    }

  function partButton(label, color, glyph, onClick) {
    const b = el("button", "dock-part");
    b.type = "button";

    g.style.background = color || "#7A4B32";
    b.appendChild(g);
    b.appendChild(el("span", null, "＋ " + label));
    b.onclick = onClick;
    return b;
  }

  function renderWingEditor() {
    const wrap = document.getElementById("wing-editor");
    if (!wrap) return;
    wrap.innerHTML = "";
    buildingState.wings.forEach(wing => {
      const isSelected = !!selected && selected.kind === "wing" && selected.id === wing.id;
      const r = el("div", "wing-row" + (isSelected ? " selected" : ""));
      const input = el("input");
      input.value = wing.name;
      input.setAttribute("aria-label", "棟名");
      input.oninput = () => {
        wing.name = input.value || "名称未設定";
        markBuildDirty();
      };
      input.onchange = () => {
        saveBuildingState(false);
        if (selected) renderPanel(selected);
      };
      r.appendChild(input);
      const pick = el("button", isSelected ? "active" : null, isSelected ? "選択中" : "選択");

      pick.onclick = () => setSelection(isSelected ? null : { kind: "wing", id: wing.id });
      r.appendChild(pick);
      wrap.appendChild(r);

      const wing = { id: `wing-${Date.now()}-${count}`, name: count === 1 ? "第一棟" : `第${count}棟` };
      buildingState.wings.push(wing);
      markBuildDirty();
      saveBuildingState(false);
      setSelection({ kind: "wing", id: wing.id });

  }

  function setDockCollapsed(collapsed) {
    editPanelEl.classList.toggle("collapsed", !!collapsed);

    if (chev) chev.textContent = collapsed ? "▸" : "▾";

    app.classList.toggle("editing", editMode);
    editPanelEl.classList.toggle("open", editMode);

  // =====================================================================
  //  追加・編集操作
  // =====================================================================
  function defaultWingForNew() {
    if (selected && selected.kind === "wing") return selected.id;
    if (selected && selected.kind === "room") { const l = roomLayout(selected.id); return l ? l.wingId : null; }
    if (selected && selected.kind === "structure") { const s = structureOf(selected.id); return s ? s.wingId : null; }
    return null;
  }
  function requestRoom(template) {
    if (window.parent === window) {
      updateSaveStatus("部屋は「部屋割り」画面から追加してください");
      return;
    }
    pendingRoomPlacement = { wingId: defaultWingForNew() || buildingState.wings[0].id, position: snappedTarget() };
    try { window.parent.postMessage({ source: "honmaru3d", type: "add_room", template, name: "" }, "*"); } catch (e) {}
    if (isMobileLayout()) setDockCollapsed(true);
  }
  function addStructure(type) {
    const def = partDef(type);
    if (!def) return;
    const sameTypeCount = buildingState.buildingObjects.filter(o => o.type === type).length;
    const id = `structure-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
    const target = snappedTarget();
    buildingState.buildingObjects.push({
      id,
      type,
      name: sameTypeCount ? `${def.label}${sameTypeCount + 1}` : def.label,
      position: { x: target.x, y: def.y || 0, z: target.z },
      rotation: 0,
      size: { x: def.defaultSize.x, z: def.defaultSize.z },
      // 建築(廊下・屋根など)は選択中の棟、なければ最初の棟に所属。外構は選択中の棟のみ、家具は所属なし
      wingId: def.category === "furniture" ? null
        : def.category === "architecture" ? (defaultWingForNew() || buildingState.wings[0].id)
        : defaultWingForNew(),
      props: {}
    });
    selected = { kind: "structure", id };
    commitChange();
    if (isMobileLayout()) setDockCollapsed(true);
  }

  function rotateSelection() {
    if (!selected) return;
    if (selected.kind === "room") {
      const layout = roomLayout(selected.id);
      if (!layout) return;
      layout.rotation = (finiteNumber(layout.rotation, 0) + Math.PI / 2) % (Math.PI * 2);
    } else if (selected.kind === "structure") {
      const item = structureOf(selected.id);
      if (!item) return;
      item.rotation = (finiteNumber(item.rotation, 0) + Math.PI / 2) % (Math.PI * 2);
    } else if (selected.kind === "wing") {
      rotateWing(selected.id);
      return;
    } else return;
    commitChange();
  }

  function resizeStructure(id, axis, amount) {
    const item = structureOf(id);
    if (!item || (axis !== "x" && axis !== "z")) return;
    const def = partDef(item.type) || {};
    item.size[axis] = Math.max(def.minSize || .8, Math.min(30, item.size[axis] + amount));
    commitChange();
  }

  function removeStructure(id) {
    const item = structureOf(id);
    if (!item || !window.confirm(`${item.name}を削除しますか？`)) return;
    buildingState.buildingObjects = buildingState.buildingObjects.filter(o => o.id !== id);
    selected = null;
    commitChange();
  }

  // ---- 棟の一括操作 ----
  function wingBounds(wingId) {
    const m = wingMembers(wingId);
    const bounds = [];
    m.rooms.forEach(o => bounds.push({ x: o.x, z: o.z, w: o.w, d: o.d }));
    m.structures.forEach(o => bounds.push({ x: o.position.x, z: o.position.z, w: o.size.x, d: o.size.z }));
    if (!bounds.length) return null;
    const minX = Math.min.apply(null, bounds.map(o => o.x - o.w / 2));
    const maxX = Math.max.apply(null, bounds.map(o => o.x + o.w / 2));
    const minZ = Math.min.apply(null, bounds.map(o => o.z - o.d / 2));
    const maxZ = Math.max.apply(null, bounds.map(o => o.z + o.d / 2));
    return { cx: (minX + maxX) / 2, cz: (minZ + maxZ) / 2, w: maxX - minX, d: maxZ - minZ };
  }
  function moveWing(wingId, dx, dz) {
    const m = wingMembers(wingId);
    m.rooms.forEach(o => {
      const l = roomLayout(o.room.id);
      if (l) { l.position.x = snap(l.position.x + dx); l.position.z = snap(l.position.z + dz); }
    });
    m.structures.forEach(s => { s.position.x = snap(s.position.x + dx); s.position.z = snap(s.position.z + dz); });
    commitChange();
  }
  function rotateWing(wingId) {
    const b = wingBounds(wingId);
    if (!b) return;
    const cx = snap(b.cx), cz = snap(b.cz);
    const turn = pos => {
      const rx = pos.x - cx, rz = pos.z - cz;
      pos.x = snap(cx + rz);
      pos.z = snap(cz - rx);
    };
    const m = wingMembers(wingId);
    m.rooms.forEach(o => {
      const l = roomLayout(o.room.id);
      if (!l) return;
      turn(l.position);
      l.rotation = (finiteNumber(l.rotation, 0) + Math.PI / 2) % (Math.PI * 2);
    });
    m.structures.forEach(s => {
      turn(s.position);
      s.rotation = (finiteNumber(s.rotation, 0) + Math.PI / 2) % (Math.PI * 2);
    });
    commitChange();
  }
  function removeWing(wingId) {
    const wing = wingOf(wingId);
    if (!wing || buildingState.wings.length <= 1) return;
    const fallback = buildingState.wings.find(w => w.id !== wingId);
    if (!window.confirm(`棟「${wing.name}」を削除しますか？\n所属する部屋・パーツは「${fallback.name}」に移ります(建物自体は消えません)。`)) return;
    Object.values(buildingState.roomLayouts).forEach(l => { if (l.wingId === wingId) l.wingId = fallback.id; });
    buildingState.buildingObjects.forEach(o => { if (o.wingId === wingId) o.wingId = fallback.id; });
    buildingState.wings = buildingState.wings.filter(w => w.id !== wingId);
    selected = null;
    commitChange();
  }

  document.getElementById("btn-mode").onclick = () => setEditMode(!editMode);
  document.getElementById("btn-save-build").onclick = () => saveBuildingState(true);
  window.addEventListener("pagehide", () => saveBuildingState(false));

  // =====================================================================
  //  ピッキング / ドラッグ(タップと区別)
  // =====================================================================
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  let downPos = null;
  let activePointers = 0;
  let dragState = null;
  const el3d = renderer.domElement;

  function dragRefOf(kind, id) {
    return kind === "room" ? roomLayout(id) : structureOf(id);
  }
  // ドラッグ対象の一覧。棟を選択中でその棟の建物を掴んだ場合は、棟の全建物をまとめる
  function dragMembersFor(hit) {
    const single = [{ kind: hit.kind, id: hit.id }];
    const list = selected && selected.kind === "wing" && belongsToWing(hit, selected.id)
      ? [].concat(
          wingMembers(selected.id).rooms.map(o => ({ kind: "room", id: o.room.id })),
          wingMembers(selected.id).structures.map(o => ({ kind: "structure", id: o.id }))
        )
      : single;
    return list.map(m => {
      const group = draggableGroups.get(`${m.kind}:${m.id}`);
      const ref = dragRefOf(m.kind, m.id);
      return group && ref ? { group, ref, sx: group.position.x, sz: group.position.z } : null;
    }).filter(Boolean);
  }

  el3d.addEventListener("pointerdown", e => {
    activePointers++;
    downPos = { x: e.clientX, y: e.clientY, multi: activePointers > 1 };
    if (!editMode || activePointers > 1) return;
    const hit = hitAt(e.clientX, e.clientY);
    if (!hit || (hit.kind !== "room" && hit.kind !== "structure")) return;
    const point = groundPoint(e.clientX, e.clientY);
    const group = draggableGroups.get(`${hit.kind}:${hit.id}`);
    if (!point || !group) return;
    const members = dragMembersFor(hit);
    dragState = {
      kind: hit.kind,
      id: hit.id,
      pointerId: e.pointerId,
      offsetX: group.position.x - point.x,
      offsetZ: group.position.z - point.z,
      startX: group.position.x,
      startZ: group.position.z,
      members,
      wingDrag: members.length > 1,
      moved: false
    };
    controls.enabled = false;
    try { el3d.setPointerCapture(e.pointerId); } catch (err) {}
  }, true);
  el3d.addEventListener("pointermove", e => {
    if (!dragState || e.pointerId !== dragState.pointerId) return;
    if (activePointers > 1) {
      dragState = null;
      controls.enabled = true;
      return;
    }
    const point = groundPoint(e.clientX, e.clientY);
    if (!point) return;
    if (!dragState.moved && downPos && Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 5) {
      dragState.moved = true;
    }
    if (!dragState.moved) return;
    const x = snap(point.x + dragState.offsetX);
    const z = snap(point.z + dragState.offsetZ);
    const dx = x - dragState.startX, dz = z - dragState.startZ;
    dragState.members.forEach(m => {
      m.group.position.x = m.sx + dx;
      m.group.position.z = m.sz + dz;
      m.ref.position.x = m.sx + dx;
      m.ref.position.z = m.sz + dz;
    });
    markBuildDirty();
  });
  el3d.addEventListener("pointerup", e => {
    activePointers = Math.max(0, activePointers - 1);
    if (dragState && e.pointerId === dragState.pointerId) {
      const completed = dragState;
      dragState = null;
      controls.enabled = true;
      try { el3d.releasePointerCapture(e.pointerId); } catch (err) {}
      downPos = null;
      if (completed.moved) {
        saveBuildingState(false);
        if (!completed.wingDrag) selected = { kind: completed.kind, id: completed.id };
        rebuild();
      } else {
        setSelection({ kind: completed.kind, id: completed.id });
      }
      return;
    }
    if (!downPos) return;
    const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 8;
    const multi = downPos.multi;
    downPos = null;
    if (moved || multi) return;
    pick(e.clientX, e.clientY);
  });
  el3d.addEventListener("pointercancel", () => {
    activePointers = 0;
    downPos = null;
    dragState = null;
    controls.enabled = true;
  });

  function updateRay(cx, cy) {
    const r = el3d.getBoundingClientRect();
    ndc.x = ((cx - r.left) / r.width) * 2 - 1;
    ndc.y = -((cy - r.top) / r.height) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
  }

  function hitAt(cx, cy) {
    updateRay(cx, cy);
    const hits = raycaster.intersectObjects(pickables, false);
    if (!hits.length) return null;
    const ud = hits[0].object.userData;
    return ud && ud.kind ? { kind: ud.kind, id: ud.id } : null;
  }

  function groundPoint(cx, cy) {
    updateRay(cx, cy);
    return raycaster.ray.intersectPlane(dragPlane, new THREE.Vector3());
  }

  function pick(cx, cy) {
    const hit = hitAt(cx, cy);
    if (!hit) { setSelection(null); return; }
    setSelection(hit);
  }

  // =====================================================================
  //  カメラ
  // =====================================================================
  let tween = null;
  function focusOn(target, dist) {
    const dir = camera.position.clone().sub(controls.target);
    if (dir.lengthSq() < 0.001) dir.set(0, 1, 1);
    dir.normalize();
    tween = {
      fromT: controls.target.clone(), fromC: camera.position.clone(),
      toT: target.clone(), toC: target.clone().add(dir.multiplyScalar(dist)),
      start: performance.now(), dur: 520
    };
  }
  function resetView() {
    const dist = Math.max(extent.w, extent.d) * 1.35 + 8;
    focusOn(new THREE.Vector3(0, 0, 0), dist);
    // 斜め上からの定番アングルに戻す
    tween.toC = new THREE.Vector3(0, dist * 0.72, dist * 0.7);
  }
  function topView() {
    const dist = Math.max(extent.w, extent.d) * 1.25 + 6;
    focusOn(new THREE.Vector3(0, 0, 0), dist);
    tween.toC = new THREE.Vector3(0, dist, 0.4);
  }
  document.getElementById("btn-reset").onclick = resetView;
  document.getElementById("btn-top").onclick = topView;

  function easeOut(k) { return 1 - Math.pow(1 - k, 3); }

  function resize() {
    const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  let lastFrame = performance.now();
  function loop() {
    requestAnimationFrame(loop);
    const now = performance.now();
    const dt = Math.min(.05, (now - lastFrame) / 1000); // タブ復帰時に花びらが飛びすぎないよう上限
    lastFrame = now;
    updateSeasonEffects(dt, now / 1000);
    if (tween) {
      const k = Math.min(1, (performance.now() - tween.start) / tween.dur);
      const e = easeOut(k);
      controls.target.lerpVectors(tween.fromT, tween.toT, e);
      camera.position.lerpVectors(tween.fromC, tween.toC, e);
      if (k >= 1) tween = null;
    }
    controls.update();
    renderer.render(scene, camera);
  }
  loop();

  // 初期表示(データ到着前)
  rebuild();

  try { window.parent && window.parent.postMessage({ source: "honmaru3d", type: "ready" }, "*"); } catch (e) {}
})();
</script>
</body>
</html>
