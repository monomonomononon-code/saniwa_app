<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2EBDD">
  <title>部屋割り</title>
  <link rel="stylesheet" href="../assets/rooms-menu.css?v=1">
</head>
<body>
  <main class="menu-page">
    <header class="menu-header">
      <h1><span class="seal">丸</span>部屋割り</h1>
      <p>利用する画面を選択してください。</p>
    </header>

    <div class="choice-list">
      <button class="choice" id="open-room-editor" type="button">
        <span class="choice-icon">配</span>
        <span class="choice-copy">
          <strong>男士の配置</strong>
          <small>刀剣男士を部屋へ配置・編集</small>
        </span>
      </button>
      <button class="choice" id="open-honmaru3d" type="button">
        <span class="choice-icon view3d">俯</span>
        <span class="choice-copy">
          <strong>見取り図（3D）</strong>
          <small>現在の部屋割りを立体で確認</small>
        </span>
      </button>
    </div>
  </main>
  <script src="../assets/rooms-menu.js?v=1"></script>
</body>
</html>
